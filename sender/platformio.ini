[platformio]
default_envs = esp32c3_debug


[env:esp32c3_debug]
platform = espressif32 
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

monitor_rts = 0
monitor_dtr = 0

;build_type = debug

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DMYPRINT

lib_extra_dirs = ../lib
lib_deps = h2zero/NimBLE-Arduino@2.5.1	
